# Slice 4D Shooter - the first multiplayer shooter set in 4D space
# Copyright (C) 2023-2026  Timofei Molokov

workspace = { members = [ "net_protocol", "game_server", "matchmaking_server", "matchbox_signaling_modified"], resolver = "2" }
[package]
name = "slice-4d-shooter"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Timofei Molokov"]


###
### When the version is changed (the counter is increased), 
### Windows game clients are updated worldwide for players.

version = "0.5.10"

###
###
###


[dependencies]

net_protocol = { path = "net_protocol" }
env_logger = "0.11"
winit = "0.30"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "metal", "wgsl"] }
bytemuck = { version = "1.25", features = [ "derive" ] }
tokio = { version = "1.54", features = ["fs", "sync", "time", "macros", "rt-multi-thread"] }
tokio-tungstenite = "0.30"
glam = "0.34"
rand = "0.10"
blink-alloc = {version = "0.4", features = ["sync"]}
fyrox-sound = "1.0"
fyrox-resource = "1.0"
fyrox-core = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = [ "derive" ] }
dirs = "7.0"
getrandom = "0.4"
matchbox_socket = "0.15.0"
opener = "0.9"
gilrs = "0.11"

[target.'cfg(windows)'.dependencies]
libloading = "0.9"

[[bin]]
name="game-client"
path="src/game_client_main.rs"

[[bin]]
name="game-client-with-windows-command-line"
path="src/game_client_main_with_windows_command_line.rs"

[[bin]]
name="game-client-without-autoupdate"
path="src/game_client_main_without_autoupdate.rs"

[build-dependencies]
proc-macro2 = "1"
syn = { version = "3", default-features = false, features = ["parsing"] }
winresource = "0.1.34"

[dev-dependencies]
# local sockets for the NetSystem connection-lifetime tests
tokio = { version = "1.54", features = ["net", "io-util"] }

# Unoptimized Alkahest gameplay encoders exceed a standard test/worker thread's stack.
[profile.dev.package.net_protocol]
opt-level = 1
