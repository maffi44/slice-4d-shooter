# Slice 4D Shooter - the first multiplayer shooter set in 4D space
# Copyright (C) 2023-2026  Timofei Molokov

workspace = { members = [ "game_server", "matchmaking_server", "matchbox_signaling_modified"], resolver = "2" }
[package]
name = "slice-4d-shooter"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Timofei Molokov"]


###
### When the version is changed (the counter is increased), 
### Windows game clients are updated worldwide for players.

version = "0.5.10"

###
###
###


[dependencies]

matchmaking_server = { path = "./matchmaking_server" }
game_server = { path = "./game_server" }
env_logger = "*"
winit = {version = "*", features = ["rwh_05"]}
windows-sys = {version = "*", features = ["Win32", "Win32_Media"]}
wgpu = { version = "*", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "metal", "webgpu", "wgsl"] }
bytemuck = { version = "*", features = [ "derive" ] }
pollster = "*"
tokio = { version = "*", features = ["fs", "sync"] }
tokio-tungstenite = "*"
web-time = "*"
glam = "*"
rand = "*"
blink-alloc = {version = "*", features = ["sync"]}
fyrox-sound = "*"
fyrox-resource = "*"
fyrox-core = "*"
image = "*"
log = "*"
serde_json = "*"
serde = { version = "1.0", features = [ "derive" ] }
dirs = "6.0"
alkahest = { version = "*", features = [ "derive" ] }
bincode = "*"
console_error_panic_hook = "*"
console_log = "*"
getrandom = { version = "*", features = [ "js" ] }
matchbox_socket = "0.12.0"
rustc-hash = "*"
opener = "*"
gilrs = "*"
winresource = "0.1.23"
libloading = "0.8"

[[bin]]
name="game-client"
path="src/game_client_main.rs"

[[bin]]
name="game-client-with-windows-command-line"
path="src/game_client_main_with_windows_command_line.rs"

[[bin]]
name="game-client-without-autoupdate"
path="src/game_client_main_without_autoupdate.rs"

[build-dependencies]
winresource = "0.1.23"
