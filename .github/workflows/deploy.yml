# Slice 4D Shooter - the first multiplayer shooter set in 4D space
# Copyright (C) 2023-2026 Timofei Molokov

name: Build clients, publish downloads and Windows updates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

# Builds only game-client for Windows and Linux on GitHub-hosted runners.
# Windows: installer.iss packages the executable and dll/WinSparkle.dll.
# WinSparkle reads the appcast hosted on this repository's GitHub Pages.
# Increase [package].version in Cargo.toml to offer an update to existing players.
# No SSH, EC2 access, server builds or game-server configuration changes.

jobs:
  get-version:
    name: Read game version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.settings.outputs.version }}
      tag: ${{ steps.settings.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read Cargo.toml
        id: settings
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          with open("Cargo.toml", "rb") as file:
              manifest = tomllib.load(file)

          version = manifest["package"]["version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9A-Za-z.+-]+", version):
              raise SystemExit("Expected a version string in [package] of Cargo.toml")

          # Every push gets its own release, even if Cargo.toml version is unchanged.
          # Re-running the same workflow run uses the same tag and the same commit.
          tag = f"v{version}-build.{os.environ['GITHUB_RUN_NUMBER']}-{os.environ['GITHUB_SHA'][:7]}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\ntag={tag}\n")
          print(f"Game version: {version}; release tag: {tag}")
          PY

  build-windows-client:
    name: Build Windows client and installer (x86_64)
    runs-on: windows-2025
    needs: get-version
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-2025-msvc-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-2025-msvc-release-

      - name: Build client
        run: cargo build --locked --release --bin game-client --target x86_64-pc-windows-msvc