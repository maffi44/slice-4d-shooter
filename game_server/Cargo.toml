# Slice 4D Shooter - the first multiplayer shooter set in 4D space
# Copyright (C) 2023-2026  Timofei Molokov

[package]
name = "game_server"
version = "0.4.6"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
tokio = { version = "1.54", features = [ "process", "sync", "time", "rt" ] }
tokio-tungstenite = "0.30"
fyrox-core = "1.0"
alkahest = { version = "0.3", features = [ "derive" ] }
serde_json = "1.0"
matchmaking_server = { path = "../matchmaking_server" }
matchbox_signaling = { path = "../matchbox_signaling_modified" }
matchbox_socket = "0.15.0"
rand = "0.10"
glam = "0.34"
blink-alloc = { version = "0.4", features = [ "sync" ] }

[lib]
name = "client_server_protocol"
path = "src/client_server_protocol.rs"
doc = false
crate-type = ["lib"]
